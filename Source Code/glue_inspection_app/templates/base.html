<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Glue Inspection System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg">
  <header class="nav">
    <div class="container row">
      <div class="brand">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="Logo" class="logo">
        <span>Glue Inspection</span>
      </div>
      <nav class="links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('image_page') }}">Image Upload</a>
        <a href="{{ url_for('live_page') }}">Live</a>
        <a href="{{ url_for('capture_page') }}">Capture</a>
      </nav>
    </div>
  </header>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="container">
    {% for m in messages %}
    <div class="flash">{{ m }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="container foot">
    <span>© 2025 Glue Inspection System</span>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
